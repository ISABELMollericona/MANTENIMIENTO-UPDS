{% extends "base.html" %}
{% block title %}Desactivar ambiente | UPDS{% endblock %}
{% block content %}<div class="content-narrow"><div class="form-panel"><h1 class="h4 mb-3">Desactivar «{{ ambiente.nombre }}»</h1><p>El ambiente dejará de estar disponible para nuevas asignaciones. Los registros existentes se conservan.</p><form method="post" class="d-flex gap-2">{% csrf_token %}<button class="btn btn-danger" type="submit">Confirmar desactivación</button><a class="btn btn-outline-secondary" href="{% url 'ubicaciones:lista' %}">Cancelar</a></form></div></div>{% endblock %}
