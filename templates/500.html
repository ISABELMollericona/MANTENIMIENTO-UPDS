<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio no disponible | UPDS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eaf2f8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; max-width: 440px; width: 100%; border-radius: 12px; border-top: 6px solid #064b87; box-shadow: 0 10px 30px rgba(4, 61, 112, .12); padding: 32px 28px; text-align: center; }
    h1 { color: #043d70; font-size: 1.4rem; margin: 0 0 12px; }
    p { margin: 0 0 20px; line-height: 1.5; }
    a { display: inline-block; background: #064b87; color: #fff; text-decoration: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; }
    a:hover { background: #043d70; }
    small { display: block; margin-top: 18px; color: #6b7280; }
  </style>
</head>
<body>
  <main class="card">
    <h1>El servicio se está reactivando</h1>
    <p>No pudimos completar tu solicitud en este momento. Normalmente se resuelve en unos segundos.</p>
    <a href="javascript:location.reload()">Reintentar</a>
    <small>UPDS Cochabamba · Gestión de mantenimiento</small>
  </main>
</body>
</html>
