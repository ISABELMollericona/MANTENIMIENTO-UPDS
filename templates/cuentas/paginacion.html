{% if is_paginated %}<nav class="mt-3" aria-label="Paginación"><ul class="pagination pagination-sm justify-content-end">{% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&estado={{ request.GET.estado|urlencode }}">Anterior</a></li>{% endif %}<li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>{% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&estado={{ request.GET.estado|urlencode }}">Siguiente</a></li>{% endif %}</ul></nav>{% endif %}
