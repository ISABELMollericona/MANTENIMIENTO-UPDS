{% extends "base.html" %}
{% block title %}Nueva contraseña | UPDS{% endblock %}
{% block content %}<div class="content-narrow"><h1 class="h3 mb-4">Crear nueva contraseña</h1>{% if validlink %}<form method="post" class="form-panel">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Guardar contraseña</button></form>{% else %}<div class="alert alert-danger">El enlace no es válido o ya fue utilizado. Solicita uno nuevo.</div>{% endif %}</div>{% endblock %}
