{% extends "base.html" %}
{% block title %}Nueva categoría | UPDS{% endblock %}
{% block content %}<div class="content-narrow"><h1 class="h3 mb-4">Crear categoría</h1><form method="post" class="form-panel">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar categoría</button><a class="btn btn-outline-secondary" href="{% url 'equipos:categorias' %}">Cancelar</a></div></form></div>{% endblock %}
